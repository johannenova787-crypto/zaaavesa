<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Завеса в Мир Эни</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  font-family: 'Cormorant Garamond', serif;
  background: radial-gradient(circle at top, #fffaf2, #f1e4cc);
  transition: opacity 2.5s ease;
}

/* Контейнер */
.veil-container {
  position: relative;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Частицы */
canvas {
  position: absolute;
  inset: 0;
  z-index: 1;
}

/* Завеса */
.veil {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    120deg,
    rgba(255,255,255,0.5),
    rgba(255,225,170,0.3),
    rgba(255,255,255,0.5)
  );
  animation: veilFlow 18s ease-in-out infinite;
  z-index: 2;
  transition: transform 3s ease, opacity 3s ease;
}

.veil.open {
  transform: scaleX(0);
  opacity: 0;
}

@keyframes veilFlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* Центр */
.portal {
  position: relative;
  z-index: 3;
  text-align: center;
  padding: 20px;
}

.portal-title {
  font-size: clamp(48px, 6vw, 82px);
  letter-spacing: 0.14em;
  color: #c6a048;
  text-shadow:
    0 0 12px rgba(255,215,150,0.45),
    0 0 26px rgba(255,200,120,0.35);
  margin-bottom: 36px;
}

.whisper {
  font-size: 24px;
  margin-top: 24px;
  letter-spacing: 0.12em;
  color: rgba(150,120,70,0.85);
  opacity: 0;
  animation: appear 6s ease forwards;
  animation-delay: 2s;
}

@keyframes appear {
  to { opacity: 1; }
}

.open-button {
  font-size: 22px;
  letter-spacing: 0.18em;
  padding: 16px 42px;
  border-radius: 60px;
  border: 1px solid rgba(190,150,80,0.6);
  background: rgba(255,245,220,0.75);
  color: #8c6b2a;
  cursor: pointer;
  transition: all 0.6s ease;
}

.open-button:hover {
  transform: scale(1.06);
  box-shadow: 0 0 30px rgba(255,220,160,0.6);
}
</style>
</head>

<body>

<audio id="veilSound" src="sound/veil.mp3" preload="auto"></audio>

<div class="veil-container">
  <canvas id="particles"></canvas>
  <div class="veil" id="veil"></div>

  <div class="portal">
    <div class="portal-title">Завеса в Мир Эни</div>
    <button class="open-button" onclick="openVeil()">Открыть</button>
    <div class="whisper">
      Пусть звучит и раскрывается,<br>
      где бы ты ни был…
    </div>
  </div>
</div>

<script>
/* Открытие завесы */
function openVeil() {
  const sound = document.getElementById('veilSound');
  const veil = document.getElementById('veil');

  sound.volume = 0.7;
  sound.play();

  veil.classList.add('open');

  setTimeout(() => {
    document.body.style.opacity = "0";
  }, 2500);

  setTimeout(() => {
    window.location.href  = "johanne.html";";
  }, 4500);
}

/* Частицы */
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

let particles = [];
for (let i = 0; i < 110; i++) {
  particles.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 1.6 + 0.6,
    v: Math.random() * 0.25 + 0.08,
    a: Math.random() * Math.PI * 2
  });
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => {
    p.y -= p.v;
    p.a += 0.01;
    if (p.y < -10) p.y = canvas.height + 10;

    ctx.beginPath();
    ctx.fillStyle = "rgba(215,175,95,0.65)";
    ctx.arc(p.x + Math.sin(p.a)*4, p.y, p.r, 0, Math.PI*2);
    ctx.fill();
  });
  requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
