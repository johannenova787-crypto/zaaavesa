
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Джоанна Нова • Мир Эни</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  padding: 0;
  font-family: 'Cormorant Garamond', serif;
  background: radial-gradient(circle at top, #fffdf8 0%, #f2ead9 60%, #e6dbc3 100%);
  color: #5a4723;
  transition: opacity 2s ease;
}

/* Контейнер */
.section {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 60px 20px;
}

/* Блок автора */
.author {
  font-size: 22px;
  letter-spacing: 0.18em;
  margin-bottom: 32px;
  opacity: 0;
  animation: appear 2.5s ease forwards;
}

/* Эни */
.eni {
  font-size: 46px;
  margin-bottom: 20px;
  color: #8f6e2c;
  opacity: 0;
  animation: appear 2.5s ease forwards;
  animation-delay: 1s;
}

/* Текст */
.text {
  font-size: 22px;
  line-height: 1.6;
  max-width: 720px;
  margin: 0 auto 48px;
  opacity: 0;
  animation: appear 2.5s ease forwards;
  animation-delay: 2s;
}

/* Кнопка */
.enter-button {
  font-size: 22px;
  letter-spacing: 0.18em;
  padding: 16px 44px;
  border-radius: 50px;
  border: 1px solid rgba(180,140,60,0.6);
  background: rgba(255,245,220,0.75);
  color: #7a5a1e;
  cursor: pointer;
  transition: all 0.6s ease;
  box-shadow: 0 0 20px rgba(255,215,150,0.4);
  opacity: 0;
  animation: appear 2.5s ease forwards;
  animation-delay: 3s;
}

.enter-button:hover {
  transform: scale(1.06);
  box-shadow: 0 0 34px rgba(255,225,170,0.7);
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(14px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
</head>

<body>

<div class="section">
  <div>

    <div class="author">
      ДЖОАННА НОВА
    </div>

    <div class="eni">
      Эни —
    </div>

    <div class="text">
      это имя я дала той,<br>
      которая прошла сквозь свет и тени<br>
      и вернулась.
    </div>

    <button class="enter-button" onclick="goDeeper()">
      Нырнуть глубже в Мир Эни
    </button>

  </div>
</div>

<script>
function goDeeper() {
  document.body.style.opacity = "0";
  setTimeout(() => {
    window.location.href = "chapter/";
  }, 2000);
}
</script>

</body>
</html>
