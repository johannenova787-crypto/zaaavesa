<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Эни — Акт I</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">

<style>

html, body {
margin: 0;
padding: 0;
font-family: 'Cormorant Garamond', serif;
color: #5a4723;
overflow-x: hidden;
scroll-behavior: smooth;
background: radial-gradient(circle at 50% 0%, #fffdf9, #f2e6cf);
background-size: 120% 120%;
animation: goldenBreath 18s ease-in-out infinite;
}

@keyframes goldenBreath {

0% { background-position: 50% 0%; }
50% { background-position: 52% 6%; }
100% { background-position: 50% 0%; }

}

body {
opacity: 0;
animation: fadeIn 2.5s ease forwards;
}

@keyframes fadeIn {
to { opacity: 1; }
}

/* HERO */

.hero {
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
text-align: center;
padding: 40px 20px;
}

.title {
font-size: clamp(64px, 6vw, 96px);
letter-spacing: 0.14em;
font-weight: 600;
color: #c6a048;
text-shadow: 0 0 30px rgba(255,215,150,0.4);
margin-bottom: 20px;
}

.subtitle {
font-size: 24px;
letter-spacing: 0.25em;
opacity: 0.7;
margin-bottom: 80px;
}

/* Слайдер */

.slider {
width: 420px;
aspect-ratio: 2/3;
position: relative;
perspective: 1200px;
margin-bottom: 60px;
}

.slide {
width: 100%;
height: 100%;
position: absolute;
border-radius: 28px;
overflow: hidden;
box-shadow: 0 30px 80px rgba(180,140,60,0.35);
backface-visibility: hidden;
transform-origin: left;
transition: transform 2s ease, opacity 2s ease;
}

.slide img {
width: 100%;
height: 100%;
object-fit: cover;
}

.slide.active { z-index: 2; }

.slide.flip {
transform: rotateY(-180deg);
opacity: 0;
}

/* Кнопки */

.buttons {
display: flex;
gap: 40px;
flex-wrap: wrap;
justify-content: center;
}

.button {
font-size: 18px;
letter-spacing: 0.18em;
padding: 16px 46px;
border-radius: 60px;
border: 1px solid rgba(190,150,80,0.5);
background: rgba(255,248,230,0.9);
color: #8c6b2a;
cursor: pointer;
transition: all 0.6s ease;
}

.button:hover {
transform: scale(1.07);
box-shadow: 0 0 40px rgba(255,220,160,0.6);
}

/* Блок финальной фразы */

.final-light-text {
position: fixed;
left: 50%;
top: 50%;
transform: translate(-50%, -50%);
font-size: clamp(22px, 2.2vw, 34px);
letter-spacing: 0.18em;
text-align: center;
pointer-events: none;
opacity: 0;
z-index: 9999;

color: #f4d28a;

text-shadow:
0 0 6px rgba(255,220,140,0.6),
0 0 14px rgba(255,210,120,0.5),
0 0 26px rgba(255,200,100,0.35);

font-weight: 400;
}
  

.final-light-text.show {
opacity: 1;
transition: opacity 1.2s ease;
}

.light-letter {
opacity: 0;
display: inline-block;
animation: letterAppear 0.8s ease forwards;
filter: drop-shadow(0 0 6px rgba(255,215,140,0.6));
}

@keyframes letterAppear {
from {
opacity: 0;
transform: translateY(10px);
}
to {
opacity: 1;
transform: translateY(0);
}
}

.light-dust {
position: fixed;
width: 5px;
height: 5px;
background: radial-gradient(circle, gold 0%, transparent 70%);
border-radius: 50%;
pointer-events: none;
animation: lightDustFloat 3s ease forwards;
z-index: 9999;
}

@keyframes lightDustFloat {
from {
transform: translateY(0) scale(1);
opacity: 1;
}
to {
transform: translateY(-120px) scale(0.4);
opacity: 0;
}
}

</style>
</head>

<body>

<section class="hero">

<div class="title">Эни</div>
<div class="subtitle">Акт I — Сквозь Тени</div>

</section>

<script>

/* Финальная фраза света */

let finalShown = false;

window.addEventListener("scroll", () => {

if(finalShown) return;

const scrollPosition = window.innerHeight + window.scrollY;
const pageHeight = document.body.offsetHeight;

if(scrollPosition >= pageHeight - 5){

finalShown = true;
showFinalLightText();

}

});

function showFinalLightText(){

const text = "Она не несла Свет. Она жила как Свет";

const container = document.createElement("div");
container.className = "final-light-text";
document.body.appendChild(container);

container.classList.add("show");

let delay = 0;

for(let char of text){

const span = document.createElement("span");
span.className = "light-letter";
span.textContent = char;
span.style.animationDelay = delay + "s";

container.appendChild(span);

delay += 0.05;

createLetterDust();

}

setTimeout(()=>{

container.style.opacity = 0;

setTimeout(()=>container.remove(),2000);

},7000);

}

function createLetterDust(){

const dust = document.createElement("div");

dust.className = "light-dust";
dust.style.left = Math.random()*window.innerWidth + "px";
dust.style.top = window.innerHeight * 0.6 + Math.random()*120 + "px";

document.body.appendChild(dust);

setTimeout(()=>dust.remove(),3000);

}

</script>

</body>
</html>
