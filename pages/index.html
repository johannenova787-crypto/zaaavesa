<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Эни</title>

<style>

body{
margin:0;
background:#000;
color:white;
font-family:serif;
overflow-x:hidden;
}

.space{
height:180vh;
}

#finalPhrase{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:40px;
opacity:0;
letter-spacing:4px;
text-align:center;
pointer-events:none;
}

.letter{
opacity:0;
transition:opacity 1.2s ease;
}

.dust{
position:fixed;
width:4px;
height:4px;
background:gold;
border-radius:50%;
pointer-events:none;
opacity:0.8;
animation:fall 3s linear forwards;
}

@keyframes fall{
0%{
transform:translateY(-20px);
opacity:1;
}
100%{
transform:translateY(120px);
opacity:0;
}
}

</style>
</head>

<body>

<div class="space"></div>

<div id="finalPhrase">
Для меня земля слишком огромна
</div>

<div class="space"></div>

<script>

let phraseShown=false

window.addEventListener("scroll",()=>{

const scrollPosition=window.scrollY
const pageHeight=document.body.scrollHeight-window.innerHeight

if(!phraseShown && scrollPosition>=pageHeight-200){

phraseShown=true

const phrase=document.getElementById("finalPhrase")
const text=phrase.innerText

phrase.innerHTML=""

text.split("").forEach((letter,i)=>{

const span=document.createElement("span")
span.classList.add("letter")
span.innerText=letter

phrase.appendChild(span)

setTimeout(()=>{
span.style.opacity=1
},i*120)

})

phrase.style.opacity=1

createDust()

}

})

function createDust(){

for(let i=0;i<40;i++){

const dust=document.createElement("div")
dust.classList.add("dust")

dust.style.left=Math.random()*100+"vw"
dust.style.top=(40+Math.random()*20)+"vh"

document.body.appendChild(dust)

setTimeout(()=>{
dust.remove()
},3000)

}

}

</script>

</body>
</html>
