
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Эни — Акт I</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  padding: 0;
  font-family: 'Cormorant Garamond', serif;
  background: radial-gradient(circle at top, #fffdf9, #f2e6cf);
  color: #5a4723;
  overflow-x: hidden;
}

/* Плавное появление страницы */
body {
  opacity: 0;
  animation: fadeIn 2.5s ease forwards;
}

@keyframes fadeIn {
  to { opacity: 1; }
}

.wrapper {
  max-width: 1200px;
  margin: 0 auto;
  padding: 120px 30px;
  text-align: center;
}

/* Заголовки */
.title {
  font-size: clamp(50px, 6vw, 84px);
  letter-spacing: 0.14em;
  font-weight: 600;
  color: #c6a048;
  text-shadow: 0 0 20px rgba(255,215,150,0.4);
  margin-bottom: 20px;
  animation: rise 2s ease forwards;
}

.subtitle {
  font-size: 22px;
  letter-spacing: 0.25em;
  opacity: 0.7;
  margin-bottom: 100px;
  animation: rise 2.5s ease forwards;
}

@keyframes rise {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Слайдер */
.slider {
  width: 360px;
  aspect-ratio: 2/3;
  margin: 0 auto 120px auto;
  position: relative;
  perspective: 1200px;
}

.slide {
  width: 100%;
  height: 100%;
  position: absolute;
  border-radius: 24px;
  overflow: hidden;
  box-shadow: 0 25px 70px rgba(180,140,60,0.3);
  backface-visibility: hidden;
  transform-origin: left;
  transition: transform 1.5s ease, opacity 1.5s ease;
}

.slide img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.slide.active {
  z-index: 2;
}

.slide.flip {
  transform: rotateY(-180deg);
  opacity: 0;
}

/* Золотая пыль */
.sparkle {
  position: absolute;
  width: 6px;
  height: 6px;
  background: radial-gradient(circle, gold 0%, transparent 70%);
  border-radius: 50%;
  pointer-events: none;
  animation: float 2s ease forwards;
}

@keyframes float {
  from { transform: translateY(0); opacity: 1; }
  to { transform: translateY(-120px); opacity: 0; }
}

/* Кнопки */
.buttons {
  display: flex;
  justify-content: center;
  gap: 40px;
  flex-wrap: wrap;
  margin-bottom: 140px;
}

.button {
  font-size: 20px;
  letter-spacing: 0.18em;
  padding: 18px 50px;
  border-radius: 60px;
  border: 1px solid rgba(190,150,80,0.5);
  background: rgba(255,248,230,0.9);
  color: #8c6b2a;
  cursor: pointer;
  transition: all 0.6s ease;
}

.button:hover {
  transform: scale(1.07);
  box-shadow: 0 0 40px rgba(255,220,160,0.6);
}

/* Отрывок */
.excerpt {
  max-width: 720px;
  margin: 0 auto;
  font-size: 22px;
  line-height: 1.9;
  opacity: 0;
  transform: translateY(40px);
  transition: all 1.5s ease;
}

.excerpt.visible {
  opacity: 0.9;
  transform: translateY(0);
}
</style>
</head>

<body>

<div class="wrapper">

  <div class="title">Эни</div>
  <div class="subtitle">Акт I — Сквозь Тени</div>

  <!-- Слайдер -->
  <div class="slider" id="slider">
    <div class="slide active"><img src="covers/cover1.jpg"></div>
    <div class="slide"><img src="covers/cover2.jpg"></div>
    <div class="slide"><img src="covers/cover3.jpg"></div>
    <div class="slide"><img src="covers/cover4.jpg"></div>
    <div class="slide"><img src="covers/cover5.jpg"></div>
    <div class="slide"><img src="covers/cover6.jpg"></div>
  </div>

  <div class="buttons">
    <button class="button" onclick="showExcerpt()">Читать отрывок</button>
    <button class="button" onclick="goDeeper()">Нырнуть глубже</button>
    <button class="button" onclick="goBuy()">Взять книгу с собой</button>
  </div>

  <div class="excerpt" id="excerpt">
    Она чувствовала дыхание теней.
    Они не были пустыми.
    Они ждали.

    И когда мир стал тише —
    начался её путь.
  </div>

</div>

<script>
const slides = document.querySelectorAll(".slide");
let current = 0;

setInterval(() => {
  slides[current].classList.add("flip");

  createSparkles();

  setTimeout(() => {
    slides[current].classList.remove("active");
    slides[current].classList.remove("flip");

    current = (current + 1) % slides.length;

    slides[current].classList.add("active");
  }, 1500);

}, 5000);

function createSparkles() {
  const slider = document.getElementById("slider");
  for(let i=0; i<20; i++){
    const spark = document.createElement("div");
    spark.className = "sparkle";
    spark.style.left = Math.random() * 100 + "%";
    spark.style.top = "60%";
    slider.appendChild(spark);
    setTimeout(() => spark.remove(), 2000);
  }
}

function showExcerpt(){
  document.getElementById("excerpt").classList.add("visible");
  document.getElementById("excerpt").scrollIntoView({behavior:"smooth"});
}

function goDeeper(){
  window.location.href = "rooms/";
}

function goBuy(){
  window.location.href = "buy.html";
}
</script>

</body>
</html>
