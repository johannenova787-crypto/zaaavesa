
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Эни — Сквозь Тени</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  padding: 0;
  font-family: 'Cormorant Garamond', serif;
  background: radial-gradient(circle at top, #fffaf2, #f1e4cc);
  color: #5a4723;
  overflow-x: hidden;
  transition: opacity 2.5s ease;
}

/* Контейнер */
.wrapper {
  max-width: 1000px;
  margin: 0 auto;
  padding: 100px 20px;
  text-align: center;
}

/* Заголовок — ТОЧНО как в Johanne */
.title {
  font-size: clamp(48px, 6vw, 82px);
  letter-spacing: 0.14em;
  font-weight: 600;
  color: #c6a048;
  text-shadow:
    0 0 12px rgba(255,215,150,0.45),
    0 0 26px rgba(255,200,120,0.35);
  margin-bottom: 70px;
  opacity: 0;
  animation: appear 2.5s ease forwards;
}

/* Слайдер */
.slider {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 40px;
  margin-bottom: 70px;
  opacity: 0;
  animation: appear 2.5s ease forwards;
  animation-delay: 1s;
}

.slider img {
  width: 280px;
  border-radius: 20px;
  box-shadow: 0 14px 45px rgba(180,140,60,0.25);
  transition: transform 0.6s ease;
}

.slider img:hover {
  transform: scale(1.05);
}

.arrow {
  font-size: 40px;
  cursor: pointer;
  color: #b8903f;
  user-select: none;
}

/* Кнопки — в стиле портала */
.buttons {
  display: flex;
  justify-content: center;
  gap: 40px;
  flex-wrap: wrap;
  opacity: 0;
  animation: appear 2.5s ease forwards;
  animation-delay: 2s;
}

.button {
  font-size: 22px;
  letter-spacing: 0.18em;
  padding: 16px 42px;
  border-radius: 60px;
  border: 1px solid rgba(190,150,80,0.6);
  background: rgba(255,245,220,0.75);
  color: #8c6b2a;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.6s ease;
}

.button:hover {
  transform: scale(1.06);
  box-shadow: 0 0 30px rgba(255,220,160,0.6);
}

/* Плавное появление */
@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(18px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
</head>

<body>

<div class="wrapper">

  <div class="title">
    Эни — Сквозь Тени
  </div>

  <div class="slider">
    <div class="arrow" onclick="prev()">‹</div>
    <img id="cover" src="images/covers/cover1.jpg" alt="Обложка">
    <div class="arrow" onclick="next()">›</div>
  </div>

  <div class="buttons">
    <button class="button" onclick="goToChapter()">
      Читать отрывок
    </button>

    <button class="button" onclick="goToRooms()">
      Нырнуть глубже
    </button>
  </div>

</div>

<script>
const covers = [
  "covers/cover1.jpg",
  "covers/cover2.jpg",
  "covers/cover3.jpg",
  "covers/cover4.jpg",
  "covers/cover5.jpg",
  "covers/cover6.jpg"
];

let current = 0;

function showCover() {
  document.getElementById("cover").src = covers[current];
}

function next() {
  current = (current + 1) % covers.length;
  showCover();
}

function prev() {
  current = (current - 1 + covers.length) % covers.length;
  showCover();
}

function goToChapter() {
  document.body.style.opacity = "0";
  setTimeout(() => {
    window.location.href = "chapter/";
  }, 2000);
}

function goToRooms() {
  document.body.style.opacity = "0";
  setTimeout(() => {
    window.location.href = "rooms/";
  }, 2000);
}
</script>

</body>
</html>
