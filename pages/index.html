<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Эни — Акт I</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">

<style>

html, body {
margin: 0;
padding: 0;
font-family: 'Cormorant Garamond', serif;
color: #5a4723;
overflow-x: hidden;
scroll-behavior: smooth;
background: radial-gradient(circle at 50% 0%, #fffdf9, #f2e6cf);
background-size: 120% 120%;
animation: goldenBreath 18s ease-in-out infinite;
}

/* дыхание фона */

@keyframes goldenBreath {

0% { background-position: 50% 0%; }
50% { background-position: 52% 6%; }
100% { background-position: 50% 0%; }

}

/* плавное появление страницы */

body {
opacity: 0;
animation: fadeIn 2.5s ease forwards;
}

@keyframes fadeIn {
to { opacity: 1; }
}

/* HERO */

.hero {
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
text-align: center;
padding: 40px 20px;
}

.title {
font-size: clamp(64px, 6vw, 96px);
letter-spacing: 0.14em;
font-weight: 600;
color: #c6a048;
text-shadow: 0 0 30px rgba(255,215,150,0.4);
margin-bottom: 20px;
}

.subtitle {
font-size: 24px;
letter-spacing: 0.25em;
opacity: 0.7;
margin-bottom: 80px;
}

/* Слайдер */

.slider {
width: 420px;
aspect-ratio: 2/3;
position: relative;
perspective: 1200px;
margin-bottom: 60px;
}

.slide {
width: 100%;
height: 100%;
position: absolute;
border-radius: 28px;
overflow: hidden;
box-shadow: 0 30px 80px rgba(180,140,60,0.35);
backface-visibility: hidden;
transform-origin: left;
transition: transform 2s ease, opacity 2s ease;
}

.slide img{
opacity:0;
transform:scale(1.02);
transition:
opacity 1.2s ease,
transform 1.6s ease;
}

.slide img.loaded{
opacity:1;
transform:scale(1);
}

.slide.active { z-index: 2; }

.slide.flip {
transform: rotateY(-180deg);
opacity: 0;
}

/* кнопки */

.buttons {
display: flex;
gap: 40px;
flex-wrap: wrap;
justify-content: center;
}

.button {
font-size: 18px;
letter-spacing: 0.18em;
padding: 16px 46px;
border-radius: 60px;
border: 1px solid rgba(190,150,80,0.5);
background: rgba(255,248,230,0.9);
color: #8c6b2a;
cursor: pointer;
transition: all 0.6s ease;
}

.button:hover {
transform: scale(1.07);
box-shadow: 0 0 40px rgba(255,220,160,0.6);
}

</style>

</head>

<body>

<!-- Здесь будет твой контент страницы -->

<script>

/* мягкая загрузка изображений */

const images = document.querySelectorAll(".slide img");

images.forEach(img => {
if (img.complete) {
img.classList.add("loaded");
} else {
img.onload = () => {
img.classList.add("loaded");
};
}
});

</script>

</body>
</html>
